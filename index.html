<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KCNX ISAP · Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0b0b0b;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .admin-container {
            width: 100%;
            max-width: 1200px;
            background: rgba(20, 20, 20, 0.95);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .admin-header h1 {
            font-size: 26px;
            background: linear-gradient(90deg, #ff3366, #ff8800, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .admin-header .sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.2);
        }
        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .admin-actions button {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }
        .admin-actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .admin-actions button.danger {
            border-color: rgba(255, 51, 102, 0.2);
            color: #ff3366;
        }
        .admin-actions button.danger:hover {
            background: rgba(255, 51, 102, 0.1);
        }
        .admin-actions button.primary {
            background: linear-gradient(135deg, #ff3366, #ff8800);
            color: #fff;
            border: none;
        }
        .admin-actions button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 51, 102, 0.2);
        }

        /* Auth overlay */
        #adminAuth {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            gap: 16px;
        }
        #adminAuth h2 {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.5);
        }
        #adminAuth input {
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 16px;
            width: 280px;
            max-width: 100%;
            outline: none;
        }
        #adminAuth input:focus {
            border-color: rgba(255, 136, 0, 0.3);
        }
        #adminAuth .error {
            color: #ff3366;
            font-size: 14px;
            min-height: 20px;
        }
        #adminAuth button {
            padding: 12px 40px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff3366, #ff8800);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        #adminAuth button:hover {
            transform: scale(1.03);
        }

        /* Dashboard */
        #adminDashboard {
            display: none;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }
        .stat-card .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.4);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        td {
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.7);
        }
        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-badge.online {
            background: rgba(0, 230, 118, 0.15);
            color: #00e676;
        }
        .status-badge.offline {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
        }
        .password-cell {
            font-family: 'Courier New', monospace;
            color: #ff8800;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.15);
        }
        .refresh-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 16px;
            text-align: right;
        }
        .admin-footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 16px;
        }
        .admin-footer .hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1>🔐 KCNX ISAP · Admin</h1>
                <div class="sub">User & password management</div>
            </div>
            <div class="admin-actions">
                <button class="primary" onclick="refreshData()">🔄 Refresh</button>
                <button onclick="exportCSV()">📥 Export CSV</button>
                <button onclick="exportJSON()">📋 Export JSON</button>
                <button class="danger" onclick="clearAllData()">🗑️ Clear All</button>
            </div>
        </div>

        <!-- Auth -->
        <div id="adminAuth">
            <h2>🔑 Developer Access</h2>
            <input type="password" id="adminPassword" placeholder="Enter master password..." />
            <div class="error" id="adminError"></div>
            <button onclick="loginAdmin()">Unlock Dashboard</button>
        </div>

        <!-- Dashboard -->
        <div id="adminDashboard">
            <div class="stats" id="statsContainer">
                <div class="stat-card">
                    <div class="number" id="totalUsers">0</div>
                    <div class="label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="onlineUsers">0</div>
                    <div class="label">Online Now</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="offlineUsers">0</div>
                    <div class="label">Offline</div>
                </div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>IP Address</th>
                            <th>Password</th>
                            <th>Status</th>
                            <th>Last Seen</th>
                            <th>Registered</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="7" class="empty-state">No users registered yet.</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="admin-footer">
                <span class="hint">💡 Data is read from localStorage (shared with main app)</span>
                <span class="refresh-time" id="lastRefresh">Last refresh: just now</span>
            </div>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  KCNX ISAP ADMIN PANEL
        //  Reads user data from localStorage
        //  Protected by master password
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const MASTER_PASSWORD = 'admin@kcnx2026'; // Change this!
        const STORAGE_KEY = 'kcnx_users';

        let isAuthenticated = false;

        function loadUserData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch { return {}; }
        }

        function loginAdmin() {
            const input = document.getElementById('adminPassword');
            const error = document.getElementById('adminError');
            const pass = input.value.trim();

            if (pass === MASTER_PASSWORD) {
                isAuthenticated = true;
                document.getElementById('adminAuth').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                refreshData();
                error.textContent = '';
                input.value = '';
            } else {
                error.textContent = '❌ Wrong password. Try again.';
                input.value = '';
                input.focus();
            }
        }

        // Enter key on password field
        document.getElementById('adminPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginAdmin();
        });

        function refreshData() {
            if (!isAuthenticated) return;
            const users = loadUserData();
            const ips = Object.keys(users);

            // Update stats
            document.getElementById('totalUsers').textContent = ips.length;
            let online = 0,
                offline = 0;
            for (const ip of ips) {
                if (users[ip].online) online++;
                else offline++;
            }
            document.getElementById('onlineUsers').textContent = online;
            document.getElementById('offlineUsers').textContent = offline;

            // Build table
            const tbody = document.getElementById('userTableBody');
            if (ips.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty-state">No users registered yet.</td></tr>`;
            } else {
                let html = '';
                let count = 1;
                for (const ip of ips) {
                    const u = users[ip];
                    const statusClass = u.online ? 'online' : 'offline';
                    const statusText = u.online ? '🟢 Online' : '⚪ Offline';
                    const lastSeen = u.lastSeen ? new Date(u.lastSeen).toLocaleString() : 'Never';
                    const registered = u.registered ? new Date(u.registered).toLocaleString() : 'Unknown';

                    html += `
                        <tr>
                            <td>${count}</td>
                            <td><strong style="color:#fff;">${u.name || 'Unknown'}</strong></td>
                            <td style="font-family:monospace;font-size:13px;color:rgba(255,255,255,0.5);">${ip}</td>
                            <td class="password-cell">${u.password || 'N/A'}</td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                            <td style="font-size:12px;color:rgba(255,255,255,0.3);">${lastSeen}</td>
                            <td style="font-size:12px;color:rgba(255,255,255,0.2);">${registered}</td>
                        </tr>
                    `;
                    count++;
                }
                tbody.innerHTML = html;
            }

            document.getElementById('lastRefresh').textContent =
                `Last refresh: ${new Date().toLocaleTimeString()}`;
        }

        function exportCSV() {
            if (!isAuthenticated) return;
            const users = loadUserData();
            const ips = Object.keys(users);
            if (ips.length === 0) {
                alert('No users to export.');
                return;
            }

            let csv = 'Name,IP Address,Password,Online,Last Seen,Registered\n';
            for (const ip of ips) {
                const u = users[ip];
                csv +=
                    `"${u.name || ''}","${ip}","${u.password || ''}","${u.online ? 'Online' : 'Offline'}","${u.lastSeen ? new Date(u.lastSeen).toLocaleString() : ''}","${u.registered ? new Date(u.registered).toLocaleString() : ''}"\n`;
            }

            downloadFile(csv, 'kcnx_users_export.csv', 'text/csv');
        }

        function exportJSON() {
            if (!isAuthenticated) return;
            const users = loadUserData();
            const json = JSON.stringify(users, null, 2);
            downloadFile(json, 'kcnx_users_export.json', 'application/json');
        }

        function downloadFile(content, filename, mime) {
            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearAllData() {
            if (!isAuthenticated) return;
            if (confirm('⚠️ This will delete ALL user data. Are you sure?')) {
                if (confirm('Last chance! Delete all users?')) {
                    localStorage.removeItem(STORAGE_KEY);
                    refreshData();
                    alert('All user data cleared.');
                }
            }
        }

        // Auto-refresh every 10 seconds
        setInterval(() => {
            if (isAuthenticated) refreshData();
        }, 10000);

        // Listen for storage changes from main app
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY && isAuthenticated) {
                refreshData();
            }
        });

        // Auto-login if session exists (simple check)
        // We'll keep it simple: user must enter password each time

        console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        console.log('🔐 KCNX ISAP Admin Panel');
        console.log(`📌 Master password: ${MASTER_PASSWORD}`);
        console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        console.log('💡 Change MASTER_PASSWORD in the script.');
        console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
    </script>
</body>
</html>
